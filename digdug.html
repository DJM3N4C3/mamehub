<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DigDug - Original Arcade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #overlay {
      position: fixed;
      top: calc(83.33% - 80px);        /* Center of lower third, moved up 80px total */
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      max-width: 59.4vw;
      max-height: 59.4vh;
      display: none;
    }

    #overlay img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 396px;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
    }

    #btn-credits {
      top: 18%;
      left: 8%;
      width: 38%;
      height: 52%;
    }

    #btn-start {
      top: 18%;
      right: 8%;
      width: 38%;
      height: 52%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <div id="overlay">
    <img src="Overlay.png" alt="Overlay">
    <div id="btn-credits" class="hotspot" onclick="insertCoin()"></div>
    <div id="btn-start" class="hotspot" onclick="startGame()"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'arcade';
    EJS_gameUrl = 'digdug.zip';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    // Official way to set default controls
    EJS_defaultControls = {
      0: { // Player 1
        0: { value: 'j', value2: 'BUTTON_2' },      // B / Fire 1
        1: { value: 'k', value2: 'BUTTON_4' },      // Y
        2: { value: 'v', value2: 'SELECT' },        // SELECT (Coin)
        3: { value: 'enter', value2: 'START' },     // START
        4: { value: 'w', value2: 'DPAD_UP' },       // UP
        5: { value: 's', value2: 'DPAD_DOWN' },     // DOWN
        6: { value: 'a', value2: 'DPAD_LEFT' },     // LEFT
        7: { value: 'd', value2: 'DPAD_RIGHT' },    // RIGHT
        8: { value: 'j', value2: 'BUTTON_1' },      // A / Fire
        9: { value: 'l', value2: 'BUTTON_3' },      // X
        10: { value: 'q', value2: 'LEFT_TOP_SHOULDER' },
        11: { value: 'e', value2: 'RIGHT_TOP_SHOULDER' }
      },
      1: {},
      2: {},
      3: {}
    };

    // Show overlay after 5 seconds
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('overlay').style.display = 'block';
      }, 5000);

      setTimeout(() => {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }, 1000);
    });

    function insertCoin() {
      pressKey('v', 'KeyV', 86);
    }

    function startGame() {
      pressKey('Enter', 'Enter', 13);
      document.getElementById('overlay').style.display = 'none';
    }

    function pressKey(key, code, keyCode) {
      const opts = {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      };

      const down = new KeyboardEvent('keydown', opts);
      const up = new KeyboardEvent('keyup', opts);

      document.dispatchEvent(down);
      document.getElementById('game')?.dispatchEvent(down);

      setTimeout(() => {
        document.dispatchEvent(up);
        document.getElementById('game')?.dispatchEvent(up);
      }, 80);
    }
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
