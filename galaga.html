<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaga - Original Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: crosshair;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      max-width: 90vw;
      max-height: 90vh;
      display: none;
    }

    #overlay img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 720px;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
    }

    #btn-credits {
      top: 18%;
      left: 8%;
      width: 38%;
      height: 52%;
    }

    #btn-start {
      top: 18%;
      right: 8%;
      width: 38%;
      height: 52%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <div id="overlay">
    <img src="Overlay.png" alt="Overlay">
    <div id="btn-credits" class="hotspot" onclick="insertCoin()"></div>
    <div id="btn-start" class="hotspot" onclick="startGame()"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'arcade';
    EJS_gameUrl = 'galaga.zip';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    EJS_Buttons = {
      "0": {
        "up": "KeyW",
        "down": "KeyS",
        "left": "KeyA",
        "right": "KeyD",
        "a": "KeyJ",
        "b": "KeyK",
        "c": "KeyL",
        "start": "Enter",
        "select": "KeyV"
      }
    };

    // Show overlay after 10 seconds
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('overlay').style.display = 'block';
      }, 10000);

      setTimeout(() => {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }, 1000);
    });

    function insertCoin() {
      pressKey('v', 'KeyV', 86);
    }

    function startGame() {
      pressKey('Enter', 'Enter', 13);
      document.getElementById('overlay').style.display = 'none';
    }

    function pressKey(key, code, keyCode) {
      const opts = {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      };

      const down = new KeyboardEvent('keydown', opts);
      const up = new KeyboardEvent('keyup', opts);

      document.dispatchEvent(down);
      document.getElementById('game')?.dispatchEvent(down);

      setTimeout(() => {
        document.dispatchEvent(up);
        document.getElementById('game')?.dispatchEvent(up);
      }, 80);
    }

    // ===== IMPROVED MOUSE CONTROLS =====
    let currentDirection = null; // 'left', 'right', or null

    function sendKey(type, key, code, keyCode) {
      const opts = {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true
      };
      const event = new KeyboardEvent(type, opts);
      document.dispatchEvent(event);
      document.getElementById('game')?.dispatchEvent(event);
    }

    document.addEventListener('mousemove', (e) => {
      const screenCenter = window.innerWidth / 2;
      const mouseX = e.clientX;

      if (mouseX < screenCenter - 40) {
        // Move left
        if (currentDirection !== 'left') {
          if (currentDirection === 'right') {
            sendKey('keyup', 'd', 'KeyD', 68);
          }
          sendKey('keydown', 'a', 'KeyA', 65);
          currentDirection = 'left';
        }
      } else if (mouseX > screenCenter + 40) {
        // Move right
        if (currentDirection !== 'right') {
          if (currentDirection === 'left') {
            sendKey('keyup', 'a', 'KeyA', 65);
          }
          sendKey('keydown', 'd', 'KeyD', 68);
          currentDirection = 'right';
        }
      } else {
        // Center - stop moving
        if (currentDirection === 'left') {
          sendKey('keyup', 'a', 'KeyA', 65);
        }
        if (currentDirection === 'right') {
          sendKey('keyup', 'd', 'KeyD', 68);
        }
        currentDirection = null;
      }
    });

    // Left click = Fire
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        pressKey('j', 'KeyJ', 74);
      }
    });
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
