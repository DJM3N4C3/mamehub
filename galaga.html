<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaga - Original Arcade</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game {
      width: 800px;
      height: 600px;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    // Emulator settings
    EJS_player = '#game';
    EJS_core = 'arcade';               // or try 'mame2003' if arcade doesn't work well
    EJS_gameUrl = 'galaga.zip';        // name of your ROM file
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;          // auto start
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
