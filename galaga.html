<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaga - Original Arcade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Custom Overlay */
    #overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      max-width: 90vw;
      max-height: 90vh;
    }

    #overlay img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 900px;
      pointer-events: none; /* image itself is not clickable */
    }

    /* Invisible click areas */
    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
    }

    /* ADD CREDITS (left gold coin) */
    #btn-credits {
      top: 18%;
      left: 8%;
      width: 38%;
      height: 52%;
    }

    /* START GAME (right red button) */
    #btn-start {
      top: 18%;
      right: 8%;
      width: 38%;
      height: 52%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <!-- Custom Overlay -->
  <div id="overlay">
    <img src="Overlay.png" alt="Overlay">

    <!-- Clickable zones -->
    <div id="btn-credits" class="hotspot" onclick="insertCoin()"></div>
    <div id="btn-start" class="hotspot" onclick="startGame()"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'arcade';
    EJS_gameUrl = 'galaga.zip';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    EJS_Buttons = {
      "0": {
        "up": "KeyW",
        "down": "KeyS",
        "left": "KeyA",
        "right": "KeyD",
        "a": "KeyJ",
        "b": "KeyK",
        "c": "KeyL",
        "start": "Digit1",
        "select": "Digit5"
      }
    };

    // Try fullscreen
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }, 800);
    });

    function insertCoin() {
      simulateKey('Digit5');
    }

    function startGame() {
      simulateKey('Digit1');
      document.getElementById('overlay').style.display = 'none';
    }

    function simulateKey(code) {
      const down = new KeyboardEvent('keydown', { code, bubbles: true });
      const up = new KeyboardEvent('keyup', { code, bubbles: true });
      document.dispatchEvent(down);
      setTimeout(() => document.dispatchEvent(up), 80);
    }
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
