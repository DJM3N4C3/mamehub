<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaga - Original Arcade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      max-width: 90vw;
      max-height: 90vh;
    }

    #overlay img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 900px;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
    }

    /* ADD CREDITS */
    #btn-credits {
      top: 18%;
      left: 8%;
      width: 38%;
      height: 52%;
    }

    /* START GAME */
    #btn-start {
      top: 18%;
      right: 8%;
      width: 38%;
      height: 52%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <div id="overlay">
    <img src="Overlay.png" alt="Overlay">
    <div id="btn-credits" class="hotspot" onclick="insertCoin()"></div>
    <div id="btn-start" class="hotspot" onclick="startGame()"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'arcade';
    EJS_gameUrl = 'galaga.zip';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    EJS_Buttons = {
      "0": {
        "up": "KeyW",
        "down": "KeyS",
        "left": "KeyA",
        "right": "KeyD",
        "a": "KeyJ",
        "b": "KeyK",
        "c": "KeyL",
        "start": "Digit1",
        "select": "Digit5"
      }
    };

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }, 1000);
    });

    function insertCoin() {
      // Stronger key simulation for coin
      pressKey('5', 'Digit5', 53);
    }

    function startGame() {
      pressKey('1', 'Digit1', 49);
      document.getElementById('overlay').style.display = 'none';
    }

    function pressKey(key, code, keyCode) {
      const opts = {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      };

      const down = new KeyboardEvent('keydown', opts);
      const up = new KeyboardEvent('keyup', opts);

      // Send to both document and the game element
      document.dispatchEvent(down);
      document.getElementById('game').dispatchEvent(down);

      setTimeout(() => {
        document.dispatchEvent(up);
        document.getElementById('game').dispatchEvent(up);
      }, 120);
    }
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
