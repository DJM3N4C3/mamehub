<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaga - Original Arcade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: crosshair;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      max-width: 90vw;
      max-height: 90vh;
      display: none;
    }

    #overlay img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 720px;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
    }

    #btn-credits {
      top: 18%;
      left: 8%;
      width: 38%;
      height: 52%;
    }

    #btn-start {
      top: 18%;
      right: 8%;
      width: 38%;
      height: 52%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <div id="overlay">
    <img src="Overlay.png" alt="Overlay">
    <div id="btn-credits" class="hotspot" onclick="insertCoin()"></div>
    <div id="btn-start" class="hotspot" onclick="startGame()"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'arcade';
    EJS_gameUrl = 'galaga.zip';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    EJS_Buttons = {
      "0": {
        "up": "KeyW",
        "down": "KeyS",
        "left": "KeyA",
        "right": "KeyD",
        "a": "KeyJ",
        "b": "KeyK",
        "c": "KeyL",
        "start": "Enter",
        "select": "KeyV"
      }
    };

    // Show overlay after 10 seconds
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('overlay').style.display = 'block';
      }, 10000);

      setTimeout(() => {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }, 1000);
    });

    function insertCoin() {
      pressKey('v', 'KeyV', 86);
    }

    function startGame() {
      pressKey('Enter', 'Enter', 13);
      document.getElementById('overlay').style.display = 'none';
    }

    function pressKey(key, code, keyCode) {
      const opts = {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      };

      const down = new KeyboardEvent('keydown', opts);
      const up = new KeyboardEvent('keyup', opts);

      document.dispatchEvent(down);
      document.getElementById('game').dispatchEvent(down);

      setTimeout(() => {
        document.dispatchEvent(up);
        document.getElementById('game').dispatchEvent(up);
      }, 80);
    }

    // ===== MOUSE CONTROLS =====
    let lastX = null;
    let isMovingLeft = false;
    let isMovingRight = false;

    document.addEventListener('mousemove', (e) => {
      if (lastX === null) {
        lastX = e.clientX;
        return;
      }

      const diff = e.clientX - lastX;

      if (diff < -3) {
        // Moving left
        if (!isMovingLeft) {
          pressKeyDown('a', 'KeyA', 65);
          isMovingLeft = true;
          isMovingRight = false;
        }
      } else if (diff > 3) {
        // Moving right
        if (!isMovingRight) {
          pressKeyDown('d', 'KeyD', 68);
          isMovingRight = true;
          isMovingLeft = false;
        }
      }

      lastX = e.clientX;
    });

    // Stop movement when mouse stops
    let moveTimeout;
    document.addEventListener('mousemove', () => {
      clearTimeout(moveTimeout);
      moveTimeout = setTimeout(() => {
        releaseMovement();
      }, 50);
    });

    function releaseMovement() {
      if (isMovingLeft) {
        pressKeyUp('a', 'KeyA', 65);
        isMovingLeft = false;
      }
      if (isMovingRight) {
        pressKeyUp('d', 'KeyD', 68);
        isMovingRight = false;
      }
    }

    // Left click = Fire
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0) { // left click
        pressKey('j', 'KeyJ', 74);
      }
    });

    function pressKeyDown(key, code, keyCode) {
      const opts = { key, code, keyCode, which: keyCode, bubbles: true };
      document.dispatchEvent(new KeyboardEvent('keydown', opts));
      document.getElementById('game').dispatchEvent(new KeyboardEvent('keydown', opts));
    }

    function pressKeyUp(key, code, keyCode) {
      const opts = { key, code, keyCode, which: keyCode, bubbles: true };
      document.dispatchEvent(new KeyboardEvent('keyup', opts));
      document.getElementById('game').dispatchEvent(new KeyboardEvent('keyup', opts));
    }
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
