<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaga - Original Arcade</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #game {
      width: 800px;
      height: 600px;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    EJS_player = '#game';
    EJS_core = 'arcade';                  // try 'mame2003' if this one has issues
    EJS_gameUrl = 'galaga.zip';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    // Custom controls
    EJS_Buttons = {
      "0": { // Player 1
        "up": "KeyW",
        "down": "KeyS",
        "left": "KeyA",
        "right": "KeyD",
        "a": "KeyJ",      // Main fire
        "b": "KeyK",      // Extra button
        "c": "KeyL",      // Extra button
        "start": "Digit1",
        "select": "Digit5" // Insert coin
      }
    };
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
