<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaga - Original Arcade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 14px 22px;
      border-radius: 10px;
      color: white;
      text-align: center;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn-row {
      display: flex;
      gap: 12px;
    }

    button {
      background: #222;
      color: white;
      border: 2px solid #555;
      padding: 9px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #444;
      border-color: #888;
    }

    .controls-note {
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <div id="overlay">
    <div class="btn-row">
      <button onclick="insertCoin()">Add Coin</button>
      <button onclick="startGame()">Start</button>
    </div>
    <div class="controls-note">
      Move: <b>W A S D</b> &nbsp;&nbsp;|&nbsp;&nbsp; Fire: <b>J K L</b>
    </div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'arcade';
    EJS_gameUrl = 'galaga.zip';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    EJS_Buttons = {
      "0": {
        "up": "KeyW",
        "down": "KeyS",
        "left": "KeyA",
        "right": "KeyD",
        "a": "KeyJ",
        "b": "KeyK",
        "c": "KeyL",
        "start": "Digit1",
        "select": "Digit5"
      }
    };

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }, 800);
    });

    function insertCoin() {
      simulateKey('Digit5');
    }

    function startGame() {
      simulateKey('Digit1');
      document.getElementById('overlay').style.display = 'none';
    }

    function simulateKey(code) {
      const down = new KeyboardEvent('keydown', { code, bubbles: true });
      const up = new KeyboardEvent('keyup', { code, bubbles: true });
      document.dispatchEvent(down);
      setTimeout(() => document.dispatchEvent(up), 80);
    }
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
