<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MAME Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* The stage holds the artwork and its hotspots.
     It scales to fit the viewport while keeping the image's aspect ratio. */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width:  min(100vw, calc(100vh * 0.7384));   /* 1084 / 1468 ≈ 0.7384 */
    height: min(100vh, calc(100vw * 1.3542));   /* 1468 / 1084 ≈ 1.3542 */
  }

  /* Artwork fills the stage */
  #stage img {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;   /* clicks pass through to hotspots */
    user-select: none;
  }

  /* ---- Grid coordinates (percentages of the image) ----
     Tweak these if any hotspot is a touch off. */
  :root {
    /* Columns (unchanged — you said these are perfect) */
    --c1: 3.0%;
    --c2: 35.0%;
    --c3: 67.0%;
    --cw: 30.0%;
  
    /* Rows */
    --r1: 1.5%;    /* top of row 1 — you said this is perfect */
    --rp: 19.1%;   /* row pitch (distance between row tops)  ← was 20% */
    --rh: 18.5%;   /* row height                             ← unchanged */
  }

  /* Column + row utility classes */
  .c1 { left: var(--c1); }
  .c2 { left: var(--c2); }
  .c3 { left: var(--c3); }

  .r1 { top: var(--r1); }
  .r2 { top: calc(var(--r1) + var(--rp)); }
  .r3 { top: calc(var(--r1) + var(--rp) * 2); }
  .r4 { top: calc(var(--r1) + var(--rp) * 3); }
  .r5 { top: calc(var(--r1) + var(--rp) * 4); }

  /* The clickable hotspots */
  .hotspot {
    position: absolute;
    display: block;
    width: var(--cw);
    height: var(--rh);
    background: transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, background 0.15s ease;
    z-index: 10;
  }

  /* Arcade-style glow on hover/focus */
  .hotspot:hover,
  .hotspot:focus-visible {
    background: rgba(0, 200, 255, 0.12);
    box-shadow:
      0 0 22px rgba(0, 200, 255, 0.9),
      0 0 60px rgba(0, 200, 255, 0.5),
      inset 0 0 18px rgba(0, 200, 255, 0.45);
    outline: none;
  }

  /* Brief "press" feedback */
  .hotspot:active {
    background: rgba(0, 200, 255, 0.25);
  }
</style>
</head>
<body>

  <div id="stage">
    <!-- Rename this file if your artwork has a different name -->
    <img src="Main.png" alt="MAME Hub — Arcade Game Selector">

    <!-- Row 1 -->
    <a class="hotspot r1 c1" href="1942.html"     aria-label="1942"></a>
    <a class="hotspot r1 c2" href="ajax.html"      aria-label="Ajax"></a>
    <a class="hotspot r1 c3" href="btime.html"     aria-label="Burger Time"></a>

    <!-- Row 2 -->
    <a class="hotspot r2 c1" href="centeped.html"  aria-label="Centipede"></a>
    <a class="hotspot r2 c2" href="contra.html"    aria-label="Contra"></a>
    <a class="hotspot r2 c3" href="digdug.html"    aria-label="Dig Dug"></a>

    <!-- Row 3 -->
    <a class="hotspot r3 c1" href="dkong.html"     aria-label="Donkey Kong"></a>
    <a class="hotspot r3 c2" href="dk3.html"       aria-label="Donkey Kong 3"></a>
    <a class="hotspot r3 c3" href="dkongjr.html"   aria-label="Donkey Kong Jr."></a>

    <!-- Row 4 -->
    <a class="hotspot r4 c1" href="frogger.html"   aria-label="Frogger"></a>
    <a class="hotspot r4 c2" href="galaga.html"    aria-label="Galaga"></a>
    <a class="hotspot r4 c3" href="mspacman.html"  aria-label="Ms. Pac-Man"></a>

    <!-- Row 5 -->
    <a class="hotspot r5 c1" href="pacman.html"    aria-label="Pac-Man"></a>
    <a class="hotspot r5 c2" href="tempest.html"   aria-label="Tempest"></a>
    <a class="hotspot r5 c3" href="timepilot.html" aria-label="Time Pilot"></a>
  </div>

</body>
</html>
